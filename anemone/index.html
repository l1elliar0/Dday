<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Couple D-Day</title>
<style>
*{box-sizing:border-box}

:root{
  --bg:#ffffff;
  --text:#232323;
  --muted:#969696;
  --line:#dedede;
  --accent:#f1c8d5; /* 캐릭터마다 이 색만 바꿔도 됨 */
}

html,body{
  margin:0;
  background:transparent;
  font-family:"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:2px;
}

.widget{
  position:relative;
  width:300px;
  height:96px;
  padding:13px 15px 12px 17px;
  background:var(--bg);
  border:1px solid #e8e8e8;
  border-radius:10px;
  overflow:hidden;
}

/* 작은 색 포인트 — 장식은 이것만 */
.widget::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:4px;
  height:100%;
  background:var(--accent);
}

.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.kicker{
  font-size:7px;
  font-weight:700;
  letter-spacing:1.35px;
  color:#7e7e7e;
}


.main{
  margin-top:9px;
  padding-right:96px;
}

.names{
  min-width:0;
}

/* D-Day는 왼쪽 글자 높이에 영향을 주지 않고 카드의 위·아래 여백 기준 중앙 */
.count{
  position:absolute;
  right:17px;
  /* 카드 상단(0px) ~ 하단 라인 시작점(약 84px)의 정중앙 */
  top:42px;
  transform:translateY(-50%);
  min-width:82px;
  text-align:right;
  font-family:
    "Pretendard",
    "Noto Sans KR",
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  font-size:30px;
  font-weight:800;
  line-height:1;
  letter-spacing:-1px;
  color:var(--text);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

.count.medium{ font-size:28px; }
.count.long{ font-size:24px; }

.pair{
  min-width:0;
  font-size:11px;
  font-weight:700;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.since{
  margin-top:4px;
  font-size:7.5px;
  color:#8b8b8b;
  letter-spacing:.25px;
}


.rule{
  position:absolute;
  left:17px;
  right:15px;
  bottom:11px;
  height:1px;
  background:var(--line);
}

.rule::after{
  content:"";
  position:absolute;
  left:0;
  top:-1px;
  width:34px;
  height:3px;
  border-radius:10px;
  background:var(--accent);
}

</style>
</head>

<body>
<section class="widget">
  <div class="head">
    <div class="kicker">PAIR ARCHIVE</div>
  </div>

  <div class="main">
    <div class="names">
      <div class="pair" id="pairName">EDEN × ANEMONE</div>
      <div class="since">since <span id="startDate">2026.07.13</span></div>
    </div>

    <div class="count" id="dday">D+1</div>
  </div>

  <div class="rule"></div>
</section>

<script>
/* 수정할 부분 */
const PAIR_NAME  = "EDEN × ANEMONE";
const START_DATE = "2026-07-13";
/* ------------ */

const TZ = "Asia/Seoul";

function getKstDate(){
  const parts = new Intl.DateTimeFormat("en-CA",{
    timeZone:TZ,
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
  }).formatToParts(new Date());

  const obj={};
  for(const p of parts){
    if(p.type!=="literal") obj[p.type]=Number(p.value);
  }
  return obj;
}

function utc(y,m,d){
  return Date.UTC(y,m-1,d);
}

function pad(n){
  return String(n).padStart(2,"0");
}

function update(){
  const now=getKstDate();
  const [sy,sm,sd]=START_DATE.split("-").map(Number);

  const diff=Math.floor(
    (utc(now.year,now.month,now.day)-utc(sy,sm,sd))/86400000
  )+1;

  document.getElementById("pairName").textContent=PAIR_NAME;
  document.getElementById("startDate").textContent=`${sy}.${pad(sm)}.${pad(sd)}`;

  const el=document.getElementById("dday");

  if(diff>0) el.textContent=`D+${diff}`;
  else if(diff===0) el.textContent="D-DAY";
  else el.textContent=`D${diff}`;

  /* D+100 / D+1000처럼 길어져도 레이아웃이 깨지지 않게 자동 축소 */
  el.classList.remove("medium","long");
  const absDays = Math.abs(diff);
  if(absDays >= 1000) el.classList.add("long");
  else if(absDays >= 100) el.classList.add("medium");
}

update();
setInterval(update,60000);
</script>
</body>
</html>
